openapi: 3.1.0
info:
  title: simapp API
  version: 0.3.1
  description: |
    仓库布局规划与运营推演应用 API。
    外层 contractVersion=0.3；布局推演 Snapshot / equip 仍为 0.2。
    M1：项目/工作台/layoutRevision、派生与权威校验、推演准备状态。
    手动路径独立可用；不含自动规划 / DES。
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: local
tags:
  - name: health
  - name: projects
  - name: layouts
  - name: jobs
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      operationId: getHealth
      responses:
        "200":
          description: ok
  /projects:
    post:
      tags: [projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: created
  /projects/{projectId}:
    get:
      tags: [projects]
      summary: Get project summary
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: project
  /projects/{projectId}/facility-revisions:
    post:
      tags: [projects]
      summary: Save facility revision
      operationId: putFacilityRevision
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility]
              properties:
                facility:
                  type: object
      responses:
        "201":
          description: saved
  /projects/{projectId}/variants:
    get:
      tags: [projects]
      summary: List variants
      operationId: listVariants
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: variants
    post:
      tags: [projects]
      summary: Create manual/template variant
      operationId: createVariant
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVariantRequest"
      responses:
        "201":
          description: created
  /layouts/{layoutId}/revisions:
    post:
      tags: [layouts]
      summary: Save immutable layout revision (not validated)
      operationId: saveLayoutRevision
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLayoutRevisionRequest"
      responses:
        "201":
          description: saved; prepareStatus=saved; simulationReady=false
        "409":
          description: revision conflict
  /layouts/{layoutId}/prepare-jobs:
    post:
      tags: [layouts]
      summary: Derive slots/aisles/accessNode + authoritative validate
      operationId: prepareLayout
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareJobRequest"
      responses:
        "202":
          description: prepare result (M1 sync completes in response)
  /layouts/{layoutId}/prepare:
    get:
      tags: [layouts]
      summary: Get last prepare result for layoutRevision
      operationId: getPrepare
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: revision
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: prepare payload including simulationReady
  /jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Get async job status
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: job status
components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, unitSystem]
      properties:
        name:
          type: string
          minLength: 1
        unitSystem:
          type: string
          enum: [metric]
    RevisionRef:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: string
    CreateVariantRequest:
      type: object
      required: [name, source, layoutRef]
      properties:
        name:
          type: string
        source:
          type: string
          enum: [manual, template, generated, edited]
        layoutRef:
          $ref: "#/components/schemas/RevisionRef"
        operatingRef:
          $ref: "#/components/schemas/RevisionRef"
    SaveLayoutRevisionRequest:
      type: object
      required: [projectId, document]
      properties:
        baseRevision:
          type: string
          nullable: true
        projectId:
          type: string
        document:
          type: object
    PrepareJobRequest:
      type: object
      required: [projectId, layoutRef, facilityRef]
      properties:
        projectId:
          type: string
        layoutRef:
          $ref: "#/components/schemas/RevisionRef"
        facilityRef:
          $ref: "#/components/schemas/RevisionRef"
        ruleSetRefs:
          type: array
          items:
            $ref: "#/components/schemas/RevisionRef"
        catalogRef:
          $ref: "#/components/schemas/RevisionRef"
        sync:
          type: boolean
          default: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
        retryable:
          type: boolean
        traceId:
          type: string
          nullable: true
